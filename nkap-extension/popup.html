<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>Nkap · Centre de contrôle</title>
  <style>
    :root {
      --bg-top: #1D150E;
      --bg-bot: #0B101D;
      --card: rgba(255, 248, 235, 0.05);
      --border: rgba(245, 183, 0, 0.22);
      --gold: #F5B700;
      --amber: #FF8C42;
      --cream: #FEF9EE;
      --muted: #A8A29E;
      --green: #34D399;
      --red: #FB7185;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      width: 332px;
      padding: 16px;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: radial-gradient(circle at 85% 0%, rgba(245, 183, 0, 0.16), transparent 52%),
                  linear-gradient(165deg, var(--bg-top) 0%, var(--bg-bot) 100%);
      color: var(--cream);
    }
    .hero {
      display: flex;
      align-items: center;
      gap: 12px;
      padding-bottom: 13px;
      border-bottom: 1px solid rgba(245, 183, 0, 0.16);
      margin-bottom: 13px;
    }
    .orb-wrap {
      position: relative;
      width: 48px;
      height: 48px;
      background: transparent;
      border: none;
      box-shadow: none;
      filter: drop-shadow(0 0 10px rgba(245, 183, 0, 0.45));
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .orb-wrap canvas { width: 48px; height: 48px; display: block; }
    .hero-text { flex: 1; min-width: 0; }
    .hero-title {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 0.01em;
      color: #FDE68A;
    }
    .ver {
      font-size: 10px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 999px;
      background: rgba(245, 183, 0, 0.15);
      color: var(--gold);
      border: 1px solid rgba(245, 183, 0, 0.35);
    }
    .hero-sub { font-size: 11.5px; color: var(--muted); margin-top: 2px; }
    .status-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 6px;
      font-size: 11px;
      font-weight: 600;
      padding: 3px 9px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #D6D3D1;
    }
    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--gold);
      box-shadow: 0 0 8px var(--gold);
    }
    .status-chip.ok { border-color: rgba(52, 211, 153, 0.4); color: #A7F3D0; background: rgba(52, 211, 153, 0.1); }
    .status-chip.ok .status-dot { background: var(--green); box-shadow: 0 0 8px var(--green); }
    .status-chip.err { border-color: rgba(251, 113, 133, 0.45); color: #FECDD3; background: rgba(251, 113, 133, 0.1); }
    .status-chip.err .status-dot { background: var(--red); box-shadow: 0 0 8px var(--red); }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px;
      margin-bottom: 11px;
      box-shadow: inset 0 1px 0 rgba(255, 224, 150, 0.1);
    }
    .card-label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #FCD34D;
      margin-bottom: 8px;
    }
    .presets { display: flex; gap: 5px; }
    .preset-btn {
      background: rgba(245, 183, 0, 0.1);
      color: #FDE68A;
      border: 1px solid rgba(245, 183, 0, 0.28);
      border-radius: 999px;
      padding: 2px 8px;
      font-size: 10.5px;
      font-weight: 600;
      cursor: pointer;
    }
    .preset-btn:hover { background: rgba(245, 183, 0, 0.24); }
    .input-row { display: flex; gap: 6px; align-items: center; }
    input[type=text] {
      flex: 1;
      min-width: 0;
      padding: 8px 10px;
      border-radius: 10px;
      border: 1px solid rgba(245, 183, 0, 0.24);
      background: rgba(8, 12, 22, 0.72);
      color: var(--cream);
      font-size: 12px;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    input[type=text]:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(245, 183, 0, 0.14);
    }
    .ping-btn {
      background: rgba(255, 255, 255, 0.08);
      color: #FDE68A;
      border: 1px solid rgba(245, 183, 0, 0.3);
      border-radius: 10px;
      padding: 8px 10px;
      font-size: 11.5px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }
    .ping-btn:hover { background: rgba(245, 183, 0, 0.2); }

    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      cursor: pointer;
    }
    .toggle-title { font-size: 13px; font-weight: 600; color: var(--cream); }
    .toggle-sub { font-size: 11px; color: var(--muted); margin-top: 2px; line-height: 1.35; }
    .switch {
      position: relative;
      width: 40px;
      height: 22px;
      flex-shrink: 0;
    }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute;
      inset: 0;
      background: rgba(255, 255, 255, 0.14);
      border-radius: 999px;
      transition: background 0.2s ease;
      border: 1px solid rgba(255, 255, 255, 0.16);
    }
    .slider:before {
      content: "";
      position: absolute;
      width: 16px;
      height: 16px;
      left: 2px;
      top: 2px;
      border-radius: 50%;
      background: #FEF9EE;
      transition: transform 0.2s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .switch input:checked + .slider {
      background: linear-gradient(135deg, var(--gold), var(--amber));
      border-color: var(--gold);
    }
    .switch input:checked + .slider:before { transform: translateX(18px); background: #140E07; }

    .save-btn {
      width: 100%;
      padding: 10px;
      border: 0;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--gold), var(--amber));
      color: #160F07;
      font-weight: 800;
      font-size: 13px;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(245, 183, 0, 0.28);
      transition: transform 0.14s ease, filter 0.14s ease;
    }
    .save-btn:hover { filter: brightness(1.06); transform: translateY(-1px); }
    .save-btn:active { transform: translateY(0); }

    .shield {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      margin-top: 10px;
      padding: 9px 10px;
      border-radius: 11px;
      background: rgba(52, 211, 153, 0.08);
      border: 1px solid rgba(52, 211, 153, 0.26);
      font-size: 11px;
      color: #A7F3D0;
      line-height: 1.4;
    }
    .footer-hint {
      margin-top: 9px;
      font-size: 11px;
      color: var(--muted);
      text-align: center;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="hero">
    <div class="orb-wrap"><canvas id="mini-orb" width="84" height="84"></canvas></div>
    <div class="hero-text">
      <div class="hero-title">
        <span>Nkap Copilote</span>
        <span class="ver">v1.2</span>
      </div>
      <div class="hero-sub">Accessibilité bancaire vivante · Ewondo &amp; Duálá</div>
      <div class="status-chip" id="status-chip">
        <span class="status-dot"></span>
        <span id="status-text">Vérification du cerveau…</span>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-label">
      <span>Serveur Cerveau (M2)</span>
      <div class="presets">
        <button type="button" class="preset-btn" data-url="https://13.51.168.107.sslip.io">EC2 Prod</button>
        <button type="button" class="preset-btn" data-url="http://127.0.0.1:8000">Local</button>
      </div>
    </div>
    <div class="input-row">
      <input type="text" id="brainUrl" placeholder="https://13.51.168.107.sslip.io" />
      <button type="button" class="ping-btn" id="ping">Tester</button>
    </div>
  </div>

  <div class="card">
    <label class="toggle-row">
      <div>
        <div class="toggle-title">Traduction locale Ewondo</div>
        <div class="toggle-sub">Auto-pausée sur <b>safinum.cm/sandbox/*</b> pour éviter tout conflit avec le bac à sable.</div>
      </div>
      <span class="switch">
        <input type="checkbox" id="ewondoOn" />
        <span class="slider"></span>
      </span>
    </label>
  </div>

  <button class="save-btn" id="save">Enregistrer &amp; synchroniser</button>

  <div class="shield">
    <span>🛡️</span>
    <span>Montants, frais et numéros toujours intacts · aucun champ PIN ou mot de passe n'est jamais lu.</span>
  </div>

  <div class="footer-hint">
    Clique sur l'<b>orbe neuronal Nkap</b> en haut à droite de la page pour ouvrir le chat.
  </div>

  <script src="popup.js"></script>
</body>
</html>
