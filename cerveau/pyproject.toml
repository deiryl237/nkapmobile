[project]
name = "nkapmoney-m2"
version = "0.1.0"
description = "Module M2 - Cerveau et harnais de validation pour le projet NKAP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.7.0",
  "pytest>=8.0.0",
  "requests>=2.32.0",
  "python-dotenv>=1.0.0",
  "httpx>=0.27.0"
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app", "app.api", "app.core"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
